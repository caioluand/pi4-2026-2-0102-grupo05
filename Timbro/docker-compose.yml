version: '3.8'

services:
  database:
    image: postgres:15-alpine
    container_name: db_certificados
    environment:
      POSTGRES_DB: certificados_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5432:5432"
    networks:
      - app-network

  backend-blockchain:
    build: ./backend-blockchain
    container_name: java_blockchain
    ports:
      - "8082:8082"
    networks:
      - app-network

  backend-api:
    build: ./backend-api
    container_name: java_api_websocket
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/certificados_db
      BLOCKCHAIN_SERVICE_URL: http://backend-blockchain:8082
    depends_on:
      - database
      - backend-blockchain
    networks:
      - app-network

  frontend:
    build: ./frontend
    container_name: web_frontend
    ports:
      - "8080:80"
    depends_on:
      - backend-api
    networks:
      - app-network

networks:
  app-network:
    driver: bridge